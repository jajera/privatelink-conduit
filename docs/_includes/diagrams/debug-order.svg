<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 430" width="100%" role="img" aria-label="Troubleshooting order for PrivateLink failures">
  <title>Troubleshooting order for PrivateLink failures</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="diagram-arrow-head"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="240" height="48" rx="10" class="diagram-accent"/>
  <text x="160.0" y="64.0" text-anchor="middle" dominant-baseline="middle" class="diagram-text" font-weight="600" font-size="12">1. Target group healthy?</text>
  <rect x="360" y="40" width="220" height="48" rx="10" class="diagram-node"/>
  <text x="470.0" y="64.0" text-anchor="middle" dominant-baseline="middle" class="diagram-text" font-weight="600" font-size="12">Fix app tier first</text>
  <line x1="280" y1="64" x2="360" y2="64" class="diagram-line" marker-end="url(#arrow)"/>
  <rect x="284.0" y="53.0" width="72" height="20" rx="4" class="diagram-edge-bg"/>
  <text x="320.0" y="64.0" text-anchor="middle" dominant-baseline="middle" class="diagram-edge-text" font-size="11">no</text>
  <line x1="160" y1="88" x2="160" y2="120" class="diagram-line" marker-end="url(#arrow)"/>
  <rect x="124.0" y="93.0" width="72" height="20" rx="4" class="diagram-edge-bg"/>
  <text x="160.0" y="104.0" text-anchor="middle" dominant-baseline="middle" class="diagram-edge-text" font-size="11">yes</text>
  <rect x="40" y="120" width="240" height="48" rx="10" class="diagram-node"/>
  <text x="160.0" y="144.0" text-anchor="middle" dominant-baseline="middle" class="diagram-text" font-weight="600" font-size="12">2. Endpoint available?</text>
  <rect x="360" y="120" width="220" height="48" rx="10" class="diagram-node"/>
  <text x="470.0" y="144.0" text-anchor="middle" dominant-baseline="middle" class="diagram-text" font-weight="600" font-size="12">Principals / acceptance</text>
  <line x1="280" y1="144" x2="360" y2="144" class="diagram-line" marker-end="url(#arrow)"/>
  <rect x="284.0" y="133.0" width="72" height="20" rx="4" class="diagram-edge-bg"/>
  <text x="320.0" y="144.0" text-anchor="middle" dominant-baseline="middle" class="diagram-edge-text" font-size="11">no</text>
  <line x1="160" y1="168" x2="160" y2="200" class="diagram-line" marker-end="url(#arrow)"/>
  <rect x="124.0" y="173.0" width="72" height="20" rx="4" class="diagram-edge-bg"/>
  <text x="160.0" y="184.0" text-anchor="middle" dominant-baseline="middle" class="diagram-edge-text" font-size="11">yes</text>
  <rect x="40" y="200" width="240" height="48" rx="10" class="diagram-node"/>
  <text x="160.0" y="224.0" text-anchor="middle" dominant-baseline="middle" class="diagram-text" font-weight="600" font-size="12">3. DNS → sandbox IP?</text>
  <rect x="360" y="200" width="220" height="48" rx="10" class="diagram-node"/>
  <text x="470.0" y="224.0" text-anchor="middle" dominant-baseline="middle" class="diagram-text" font-weight="600" font-size="12">Zone or alias record</text>
  <line x1="280" y1="224" x2="360" y2="224" class="diagram-line" marker-end="url(#arrow)"/>
  <rect x="284.0" y="213.0" width="72" height="20" rx="4" class="diagram-edge-bg"/>
  <text x="320.0" y="224.0" text-anchor="middle" dominant-baseline="middle" class="diagram-edge-text" font-size="11">no</text>
  <line x1="160" y1="248" x2="160" y2="280" class="diagram-line" marker-end="url(#arrow)"/>
  <rect x="124.0" y="253.0" width="72" height="20" rx="4" class="diagram-edge-bg"/>
  <text x="160.0" y="264.0" text-anchor="middle" dominant-baseline="middle" class="diagram-edge-text" font-size="11">yes</text>
  <rect x="40" y="280" width="240" height="48" rx="10" class="diagram-node"/>
  <text x="160.0" y="304.0" text-anchor="middle" dominant-baseline="middle" class="diagram-text" font-weight="600" font-size="12">4. TCP connects?</text>
  <rect x="360" y="280" width="220" height="48" rx="10" class="diagram-node"/>
  <text x="470.0" y="304.0" text-anchor="middle" dominant-baseline="middle" class="diagram-text" font-weight="600" font-size="12">Endpoint SG ingress</text>
  <line x1="280" y1="304" x2="360" y2="304" class="diagram-line" marker-end="url(#arrow)"/>
  <rect x="284.0" y="293.0" width="72" height="20" rx="4" class="diagram-edge-bg"/>
  <text x="320.0" y="304.0" text-anchor="middle" dominant-baseline="middle" class="diagram-edge-text" font-size="11">no</text>
  <line x1="160" y1="328" x2="160" y2="360" class="diagram-line" marker-end="url(#arrow)"/>
  <rect x="124.0" y="333.0" width="72" height="20" rx="4" class="diagram-edge-bg"/>
  <text x="160.0" y="344.0" text-anchor="middle" dominant-baseline="middle" class="diagram-edge-text" font-size="11">yes</text>
  <rect x="40" y="360" width="240" height="48" rx="10" class="diagram-node"/>
  <text x="160.0" y="384.0" text-anchor="middle" dominant-baseline="middle" class="diagram-text" font-weight="600" font-size="12">5. App responds?</text>
  <rect x="360" y="360" width="220" height="48" rx="10" class="diagram-node"/>
  <text x="470.0" y="384.0" text-anchor="middle" dominant-baseline="middle" class="diagram-text" font-weight="600" font-size="12">preserve_client_ip / app SG</text>
  <line x1="280" y1="384" x2="360" y2="384" class="diagram-line" marker-end="url(#arrow)"/>
  <rect x="284.0" y="373.0" width="72" height="20" rx="4" class="diagram-edge-bg"/>
  <text x="320.0" y="384.0" text-anchor="middle" dominant-baseline="middle" class="diagram-edge-text" font-size="11">no</text>
</svg>
