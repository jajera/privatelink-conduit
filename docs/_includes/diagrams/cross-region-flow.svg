<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 440" width="100%" role="img" aria-label="Cross-Region PrivateLink decision flow">
  <title>Cross-Region PrivateLink decision flow</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="diagram-arrow-head"/>
    </marker>
  </defs>
  <rect x="200" y="20" width="200" height="50" rx="10" class="diagram-node"/>
  <text x="300.0" y="45.0" text-anchor="middle" dominant-baseline="middle" class="diagram-text" font-weight="600" font-size="12">Create endpoint service</text>
  <rect x="200" y="100" width="200" height="50" rx="10" class="diagram-node"/>
  <text x="300.0" y="125.0" text-anchor="middle" dominant-baseline="middle" class="diagram-text" font-weight="600" font-size="12">List supported_regions</text>
  <rect x="200" y="180" width="200" height="56" rx="10" class="diagram-accent"/>
  <text x="300.0" y="208.0" text-anchor="middle" dominant-baseline="middle" class="diagram-text" font-weight="600" font-size="12">Consumer Region OK?</text>
  <rect x="20" y="280" width="160" height="56" rx="10" class="diagram-node"/>
  <text x="100.0" y="308.0" text-anchor="middle" dominant-baseline="middle" class="diagram-text" font-weight="600" font-size="12">NZ → API rejects</text>
  <rect x="220" y="280" width="200" height="56" rx="10" class="diagram-node"/>
  <text x="320.0" y="300.5" text-anchor="middle" dominant-baseline="middle" class="diagram-text" font-weight="600" font-size="12">Melbourne → create</text>
  <text x="320.0" y="315.5" text-anchor="middle" dominant-baseline="middle" class="diagram-text" font-size="11">endpoint + service_region</text>
  <rect x="220" y="370" width="200" height="50" rx="10" class="diagram-accent"/>
  <text x="320.0" y="395.0" text-anchor="middle" dominant-baseline="middle" class="diagram-text" font-weight="600" font-size="12">Traffic on AWS backbone</text>
  <line x1="300" y1="70" x2="300" y2="100" class="diagram-line" marker-end="url(#arrow)"/>
  <line x1="300" y1="150" x2="300" y2="180" class="diagram-line" marker-end="url(#arrow)"/>
  <line x1="240" y1="236" x2="140" y2="280" class="diagram-line" marker-end="url(#arrow)"/>
  <rect x="154.0" y="247.0" width="72" height="20" rx="4" class="diagram-edge-bg"/>
  <text x="190.0" y="258.0" text-anchor="middle" dominant-baseline="middle" class="diagram-edge-text" font-size="11">no</text>
  <line x1="300" y1="236" x2="300" y2="280" class="diagram-line" marker-end="url(#arrow)"/>
  <rect x="264.0" y="247.0" width="72" height="20" rx="4" class="diagram-edge-bg"/>
  <text x="300.0" y="258.0" text-anchor="middle" dominant-baseline="middle" class="diagram-edge-text" font-size="11">yes</text>
  <line x1="320" y1="336" x2="320" y2="370" class="diagram-line" marker-end="url(#arrow)"/>
</svg>
