<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 160" width="100%" role="img" aria-label="Excluded workaround: landing VPC plus internal Region hop">
  <title>Excluded workaround: landing VPC plus internal Region hop</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="diagram-arrow-head"/>
    </marker>
  </defs>
  <rect x="20" y="40" width="160" height="100" rx="12" class="diagram-cluster"/>
  <text x="34" y="62" class="diagram-label" font-weight="600" font-size="12">Consumer · eligible Region</text>
  <rect x="40" y="70" width="120" height="50" rx="10" class="diagram-node"/>
  <text x="100.0" y="95.0" text-anchor="middle" dominant-baseline="middle" class="diagram-text" font-weight="600" font-size="12">Client → VPCE</text>
  <rect x="220" y="40" width="200" height="100" rx="12" class="diagram-cluster"/>
  <text x="234" y="62" class="diagram-label" font-weight="600" font-size="12">Landing VPC · eligible Region</text>
  <rect x="240" y="65" width="160" height="60" rx="10" class="diagram-accent"/>
  <text x="320.0" y="87.5" text-anchor="middle" dominant-baseline="middle" class="diagram-text" font-weight="600" font-size="12">EP svc → NLB</text>
  <text x="320.0" y="102.5" text-anchor="middle" dominant-baseline="middle" class="diagram-text" font-size="11">→ proxy</text>
  <rect x="460" y="40" width="180" height="100" rx="12" class="diagram-cluster"/>
  <text x="474" y="62" class="diagram-label" font-weight="600" font-size="12">Workload · ineligible Region</text>
  <rect x="480" y="70" width="140" height="50" rx="10" class="diagram-node"/>
  <text x="550.0" y="95.0" text-anchor="middle" dominant-baseline="middle" class="diagram-text" font-weight="600" font-size="12">NLB → app</text>
  <line x1="160" y1="95" x2="240" y2="95" class="diagram-line" marker-end="url(#arrow)"/>
  <rect x="154.5" y="84.0" width="91.0" height="20" rx="4" class="diagram-edge-bg"/>
  <text x="200.0" y="95.0" text-anchor="middle" dominant-baseline="middle" class="diagram-edge-text" font-size="11">same-Region PL</text>
  <line x1="400" y1="95" x2="480" y2="95" class="diagram-line" marker-end="url(#arrow)"/>
  <rect x="401.0" y="84.0" width="78.0" height="20" rx="4" class="diagram-edge-bg"/>
  <text x="440.0" y="95.0" text-anchor="middle" dominant-baseline="middle" class="diagram-edge-text" font-size="11">internal hop</text>
</svg>
