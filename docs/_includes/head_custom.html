<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Sora:wght@500;600;700&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/images/favicon-32.png' | relative_url }}">
<link rel="icon" type="image/png" sizes="16x16" href="{{ '/assets/images/favicon-16.png' | relative_url }}">
<link rel="apple-touch-icon" sizes="180x180" href="{{ '/assets/images/apple-touch-icon.png' | relative_url }}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<script>
(function () {
  try {
    var LIGHT = 'conduit';
    var DARK = 'conduit-dark';
    var theme = localStorage.getItem('plc-docs-theme');
    if (theme !== LIGHT && theme !== DARK) {
      theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? DARK : LIGHT;
    }
    var link = document.querySelector('link[rel="stylesheet"]');
    if (!link) return;
    link.href = '{{ "/assets/css/just-the-docs-" | relative_url }}' + theme + '.css';
  } catch (e) {}
})();
</script>
