title: PrivateLink Conduit
description: >-
  Cross-account AWS PrivateLink into a 3-tier private API, and what to do when
  cross-Region PrivateLink is not available in your provider Region.

theme: just-the-docs

url: https://privatelink-conduit.johna.kiwi
baseurl: ""

permalink: pretty

# ── Navigation ────────────────────────────────────────────────────────────────
heading_anchors: true
back_to_top: true
back_to_top_text: "Back to top"

aux_links:
  GitHub: https://github.com/jajera/privatelink-conduit
aux_links_new_tab: true

# ── Appearance ────────────────────────────────────────────────────────────────
# Custom schemes: conduit (light) + conduit-dark (toggle in header)
# Built CSS: assets/css/just-the-docs-conduit{,-dark}.scss
color_scheme: conduit

favicon_ico: "/assets/images/favicon.ico"

# Site-wide Open Graph / Twitter card (jekyll-seo-tag). Do not set `logo` —
# just-the-docs would swap the header title for that image.
defaults:
  - scope:
      path: ""
    values:
      image: /assets/images/og-image.png

twitter:
  card: summary_large_image

# just-the-docs 0.12 still uses Sass @import / map-get / darken() internally
# (upstream: just-the-docs#1607). Quiet that until the theme migrates to @use.
# Our conduit-dark scheme no longer imports their dark.scss (avoids lighten/darken).
sass:
  quiet_deps: true
  silence_deprecations:
    - import
    - global-builtin
    - color-functions


# ── Search ────────────────────────────────────────────────────────────────────
search_enabled: true
search:
  heading_level: 3
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false

# ── Diagrams ──────────────────────────────────────────────────────────────────
# Static SVG includes in _includes/diagrams/ (see docs/diagrams/README.md).
# Mermaid removed — layout was unreliable for these docs.

# ── Callouts ──────────────────────────────────────────────────────────────────
callouts_level: loud
callouts:
  finding:
    title: Finding
    color: green
  note:
    title: Note
    color: blue
  tip:
    title: Tip
    color: purple
  warning:
    title: Warning
    color: yellow
  blocked:
    title: Not possible today
    color: red
  cost:
    title: Cost
    color: red

# ── Footer ────────────────────────────────────────────────────────────────────
footer_content: >-
  Demo repository. Region and feature availability changes often — verify
  against current AWS documentation before relying on any limitation described
  here.

plugins:
  - jekyll-seo-tag
  - jekyll-include-cache

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor/
  - README.md
  # Authoring notes, not published content
  - walkthrough-brief.md
